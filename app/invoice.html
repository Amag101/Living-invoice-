<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your invoice</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e6e3db;
    --accent: #1f5f4a; --accent-ink: #ffffff; --soft: #eef4f1; --warn: #8a5a00; --warn-bg: #fff6e0;
    --me: #1f5f4a; --me-ink: #ffffff; --them: #f0eee8; --good: #1f6f3f; --good-bg: #e7f4ec;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --card: #1e1e1c; --ink: #ecebe6; --muted: #a09e97; --line: #33322f;
      --accent: #5fb898; --accent-ink: #0f1f19; --soft: #1d2a25; --warn: #f0c060; --warn-bg: #2d2617;
      --me: #2f7d63; --me-ink: #ffffff; --them: #2a2a27; --good: #7fd3a0; --good-bg: #1b2b21;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  header .sub { color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .pad { padding: 18px 20px; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--soft);
          color: var(--accent); font-weight: 600; }
  .pill.paid { background: var(--good-bg); color: var(--good); }
  .pill.void { background: var(--them); color: var(--muted); }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .k { color: var(--muted); }
  .row.big { font-size: 18px; font-weight: 700; }
  .row .strike { text-decoration: line-through; color: var(--muted); font-weight: 400; margin-right: 6px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .plan { width: 100%; border-collapse: collapse; font-size: 14px; }
  .plan td { padding: 6px 0; border-top: 1px solid var(--line); }
  .plan td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }
  .paybox { margin-top: 14px; padding: 16px 20px; border-top: 1px solid var(--line); }
  .due { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .due strong { font-size: 26px; letter-spacing: -.02em; }
  .choice { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .choice label { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; cursor: pointer; font-size: 14px; }
  .choice input { margin-right: 6px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
           color: var(--ink); padding: 9px 14px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; width: 100%;
                   padding: 12px 14px; }
  button:disabled { opacity: .6; cursor: default; }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .error { color: #b3261e; font-size: 14px; margin-top: 8px; }
  .banner { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 0 0 12px; }
  .chat { display: flex; flex-direction: column; height: min(640px, calc(100vh - 140px)); min-height: 420px; }
  .chat-head { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .chat-head .t { font-weight: 700; }
  .chat-head .s { color: var(--muted); font-size: 13px; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 84%; padding: 9px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.client { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--them); border-bottom-left-radius: 4px; }
  .msg.typing { color: var(--muted); font-style: italic; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 18px 10px; }
  .chips button { font-size: 13px; padding: 5px 10px; border-radius: 999px; }
  form.send { display: flex; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
  form.send input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
                    background: var(--bg); color: var(--ink); }
  form.send button { flex: none; }
  .empty { color: var(--muted); font-size: 14px; }
  #paypal-buttons { min-height: 45px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="biz">Loading your invoice…</h1>
    <span class="sub" id="number"></span>
    <span id="status"></span>
  </header>
  <div id="fatal" class="error" hidden></div>
  <div class="grid" id="grid" hidden>
    <section class="card">
      <div class="pad">
        <h2>Invoice</h2>
        <div id="lines"></div>
        <div id="plan"></div>
      </div>
      <div class="paybox" id="paybox"></div>
    </section>
    <section class="card chat">
      <div class="chat-head">
        <div class="t">Ask this invoice</div>
        <div class="s" id="chat-sub">Questions, a payment plan, more time, or a discount for paying today.</div>
      </div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form class="send" id="send">
        <input id="text" maxlength="1000" autocomplete="off" placeholder="Type a message…" aria-label="Message">
        <button type="submit" id="sendbtn">Send</button>
      </form>
    </section>
  </div>
  <footer id="foot"></footer>
</div>
<script>
const token = location.pathname.split("/").filter(Boolean)[1] || "";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = null, busy = false, which = "now", paypalLoaded = false, lastChat = -1;

function cash(x) {
  const v = Math.round(Number(x) * 100) / 100;
  const s = Number.isInteger(v) ? v.toLocaleString("en-US") : v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  return (S ? S.currency : "$") + s;
}

async function api(path, body) {
  const opts = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  const r = await fetch("/api/i/" + encodeURIComponent(token) + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Something went wrong");
  return data;
}

function render() {
  document.title = `${S.number} from ${S.business}`;
  $("#biz").textContent = S.business;
  $("#number").textContent = `Invoice ${S.number} · issued ${S.issued}`;
  const st = S.status === "paid" ? `<span class="pill paid">Paid</span>` : S.status === "sent" ? `<span class="pill">Due ${esc(S.due_date)}</span>` : `<span class="pill void">Cancelled</span>`;
  $("#status").innerHTML = st;
  $("#grid").hidden = false;

  const disc = S.discount_pct ? S.amount * S.discount_pct / 100 : 0;
  $("#lines").innerHTML = `
    <div class="row"><span class="k">For</span><span>${esc(S.client)}</span></div>
    <div class="row"><span class="k">Work</span><span>${esc(S.title)}</span></div>
    <div class="row"><span class="k">Price</span><span class="num">${cash(S.amount)}</span></div>
    ${disc ? `<div class="row"><span class="k">Discount (${+S.discount_pct.toFixed(1)}%)</span><span class="num">−${cash(disc)}</span></div>` : ""}
    <div class="row"><span class="k">Total</span><span class="num">${cash(S.total)}</span></div>
    ${S.paid ? `<div class="row"><span class="k">Paid so far</span><span class="num">${cash(S.paid)}</span></div>` : ""}
    <div class="row big"><span>Balance</span><span class="num">${cash(S.balance)}</span></div>
    <div class="row"><span class="k">Due date</span><span>${esc(S.due_date)}</span></div>`;

  $("#plan").innerHTML = S.plan.length ? `<h2 style="margin-top:16px">Payment plan</h2>
    <table class="plan">${S.plan.map((p) => `<tr><td>${esc(p.due)}</td><td class="num">${cash(p.amount)}</td>
      <td class="num">${p.owed <= 0 ? "Paid" : p.owed < p.amount ? cash(p.owed) + " left" : ""}</td></tr>`).join("")}</table>` : "";

  renderPay();
  renderChat();
  $("#foot").textContent = S.mode === "fake" ? "Demo mode: payments go to a simulated PayPal sandbox." :
    S.mode === "offline" ? "Demo mode: PayPal isn't connected, so payments are simulated." :
    S.paypal_env === "sandbox" ? "PayPal sandbox: no real money moves." : "";
}

function renderPay() {
  const box = $("#paybox");
  if (S.status !== "sent") {
    box.innerHTML = `<div class="due"><span>${S.status === "paid" ? "Paid in full. Thank you!" : "This invoice was cancelled."}</span></div>`;
    return;
  }
  const hasChoice = S.due_now < S.balance - 0.005;
  if (!hasChoice) which = "now";
  const amount = which === "balance" ? S.balance : S.due_now;
  const waiting = S.waiting_for_owner ? `<div class="banner">Waiting for ${esc(S.business)} to answer your request for ${esc(S.waiting_for_owner)}.</div>` : "";
  box.innerHTML = `${waiting}
    <div class="due"><span>${hasChoice && which === "now" ? "Due now" : "Pay"}</span><strong class="num">${cash(amount)}</strong></div>
    ${hasChoice ? `<div class="choice">
      <label><input type="radio" name="which" value="now" ${which === "now" ? "checked" : ""}>Next payment (${cash(S.due_now)})</label>
      <label><input type="radio" name="which" value="balance" ${which === "balance" ? "checked" : ""}>Whole balance (${cash(S.balance)})</label></div>` : ""}
    <div id="paypal-buttons"></div>
    <div class="error" id="payerr" hidden></div>
    ${S.payer_url && S.mode === "paypal" ? `<div class="note">Prefer PayPal's own page? <a href="${esc(S.payer_url)}" target="_blank" rel="noopener">Open this invoice on PayPal</a>.</div>` : ""}`;
  box.querySelectorAll("input[name=which]").forEach((r) => r.addEventListener("change", () => { which = r.value; renderPay(); }));

  const holder = $("#paypal-buttons");
  if (S.mode === "paypal") {
    loadPayPal().then(() => {
      window.paypal.Buttons({
        style: {layout: "vertical", shape: "rect", label: "pay"},
        createOrder: async () => (await api("/orders", {which})).order_id,
        onApprove: async (data) => { S = await api(`/orders/${data.orderID}/capture`, {}); render(); },
        onError: (err) => payError(err && err.message ? err.message : "PayPal couldn't complete the payment."),
      }).render(holder);
    }).catch(() => payError("PayPal didn't load. Check your connection and refresh."));
  } else {
    const label = S.mode === "fake" ? `Pay ${cash(amount)} with PayPal (simulated)` : `Simulate a ${cash(amount)} payment`;
    holder.innerHTML = `<button class="primary" id="paybtn">${label}</button>`;
    $("#paybtn").addEventListener("click", payDemo);
  }
}

function loadPayPal() {
  if (paypalLoaded) return Promise.resolve();
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(S.paypal_client_id)}&currency=${encodeURIComponent(S.currency_code)}&intent=capture&enable-funding=paylater`;
    s.onload = () => { paypalLoaded = true; ok(); };
    s.onerror = fail;
    document.head.appendChild(s);
  });
}

function payError(msg) { const e = $("#payerr"); if (e) { e.textContent = msg; e.hidden = false; } }

async function payDemo() {
  const b = $("#paybtn"); b.disabled = true; b.textContent = "Processing…";
  try {
    if (S.mode === "fake") {
      const {order_id} = await api("/orders", {which});
      await api(`/orders/${order_id}/fake-approve`, {});   // stands in for the buyer's PayPal popup
      S = await api(`/orders/${order_id}/capture`, {});
    } else {
      S = await api("/demo-pay", {which});
    }
    which = "now";
    render();
  } catch (e) { payError(e.message); b.disabled = false; b.textContent = "Try again"; }
}

function renderChat() {
  if (S.chat.length === lastChat && !busy) return;
  lastChat = S.chat.length;
  const m = $("#msgs");
  m.innerHTML = S.chat.length ? S.chat.map((c) => `<div class="msg ${c.role === "client" ? "client" : "agent"}">${esc(c.body)}</div>`).join("")
    : `<div class="msg agent">Hi! I'm the assistant on this invoice from ${esc(S.business)}. I can explain it, set up a payment plan, move the due date, or tell you about paying early. What would help?</div>`;
  if (busy) m.insertAdjacentHTML("beforeend", `<div class="msg agent typing">Thinking…</div>`);
  const open = S.status === "sent";
  $("#text").disabled = !open || busy; $("#sendbtn").disabled = !open || busy;
  $("#chips").innerHTML = open && !busy ? ["Can I split this into 3 payments?", "Any discount if I pay today?",
    "Could I have two more weeks?", "What is this invoice for?"].map((t) => `<button type="button">${esc(t)}</button>`).join("") : "";
  $("#chips").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => send(b.textContent)));
  m.scrollTop = m.scrollHeight;  // after the chips, which change the list's height
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  S.chat = S.chat.concat([{role: "client", body: text}]);
  lastChat = -1; renderChat();
  try { S = await api("/chat", {text}); $("#text").value = ""; }
  catch (e) { S.chat = S.chat.concat([{role: "agent", body: e.message}]); }
  busy = false; lastChat = -1; render();
}

$("#send").addEventListener("submit", (e) => { e.preventDefault(); send($("#text").value); });

async function refresh() {
  try {
    const next = await api("");
    const changed = !S || JSON.stringify(next) !== JSON.stringify(S);
    S = next;
    if (changed && !busy) render();
  } catch (e) {
    if (!S) { $("#biz").textContent = "Invoice not found"; $("#fatal").textContent = e.message; $("#fatal").hidden = false; }
  }
}
refresh();
setInterval(() => { if (!busy && document.visibilityState === "visible") refresh(); }, 4000);
</script>
</body>
</html>
